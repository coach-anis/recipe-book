<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach Anis — High Protein Recipes</title>
<meta name="description" content="50 high-protein recipes with full macros. Clean, practical nutrition for training and fat loss.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #09090b;
  --surface: #111113;
  --surface2: #18181b;
  --surface3: #1f1f23;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #fafafa;
  --text2: #a1a1aa;
  --text3: #71717a;
  --accent: #22c55e;
  --accent2: #16a34a;
  --accent-soft: rgba(34,197,94,0.12);
  --gold: #eab308;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --font: 'Inter', system-ui, -apple-system, sans-serif;
  --display: 'Syne', system-ui, sans-serif;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
button, input { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: inherit; text-decoration: none; }

/* ========== NAV ========== */
.nav {
  position: sticky;
  top: 0;
  z-index: 100;
  height: 64px;
  background: rgba(9,9,11,0.85);
  backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 0 28px;
}
.nav-logo {
  font-family: var(--display);
  font-weight: 800;
  font-size: 18px;
  letter-spacing: -0.03em;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.nav-logo span {
  color: var(--accent);
}
.nav-search {
  flex: 1;
  max-width: 420px;
  margin: 0 auto;
  position: relative;
}
.nav-search input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 10px 16px 10px 42px;
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: border-color .2s, background .2s;
}
.nav-search input:focus {
  border-color: rgba(34,197,94,0.4);
  background: var(--surface2);
}
.nav-search input::placeholder { color: var(--text3); }
.nav-search svg {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  color: var(--text3);
  pointer-events: none;
}
.nav-actions {
  display: flex;
  gap: 8px;
}
.nav-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 14px;
  color: var(--text2);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all .15s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.nav-btn:hover, .nav-btn.active {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-soft);
}
.nav-fav-count {
  display: none;
  background: var(--accent);
  color: #000;
  font-size: 11px;
  font-weight: 700;
  border-radius: 999px;
  padding: 1px 6px;
  min-width: 18px;
  text-align: center;
}
.nav-fav-count.show { display: inline-block; }

/* ========== HERO ========== */
.hero {
  padding: 72px 28px 48px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  top: -120px;
  left: 50%;
  transform: translateX(-50%);
  width: 600px;
  height: 400px;
  background: radial-gradient(ellipse, rgba(34,197,94,0.08) 0%, transparent 70%);
  pointer-events: none;
}
.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 12px;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: 999px;
  margin-bottom: 20px;
  letter-spacing: 0.02em;
}
.hero h1 {
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(36px, 6vw, 56px);
  line-height: 1.1;
  letter-spacing: -0.04em;
  margin-bottom: 16px;
}
.hero h1 em {
  font-style: normal;
  color: var(--accent);
}
.hero p {
  color: var(--text2);
  font-size: 17px;
  max-width: 480px;
  margin: 0 auto 32px;
}
.hero-stats {
  display: flex;
  justify-content: center;
  gap: 40px;
  flex-wrap: wrap;
}
.hero-stat {
  text-align: center;
}
.hero-stat strong {
  display: block;
  font-family: var(--display);
  font-size: 28px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.02em;
}
.hero-stat span {
  font-size: 13px;
  color: var(--text3);
  font-weight: 500;
}

/* ========== FILTERS ========== */
.filters {
  padding: 0 28px 32px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
}
.filter-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 8px 16px;
  color: var(--text2);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all .15s;
}
.filter-btn:hover {
  border-color: var(--border2);
  color: var(--text);
}
.filter-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #000;
  font-weight: 600;
}

/* ========== GRID ========== */
.main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 28px 80px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  cursor: pointer;
  transition: all .2s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}
.card:hover {
  border-color: var(--border2);
  background: var(--surface2);
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}
.card-cat {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--accent);
  margin-bottom: 10px;
}
.card-title {
  font-family: var(--display);
  font-weight: 700;
  font-size: 18px;
  line-height: 1.3;
  letter-spacing: -0.02em;
  margin-bottom: 16px;
  flex: 1;
}
.card-macros {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.macro {
  font-size: 12px;
  color: var(--text3);
  font-weight: 500;
}
.macro strong {
  color: var(--text);
  font-weight: 600;
}
.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}
.card-time {
  font-size: 12px;
  color: var(--text3);
  display: flex;
  align-items: center;
  gap: 4px;
}
.card-fav {
  background: none;
  border: none;
  color: var(--text3);
  cursor: pointer;
  padding: 4px;
  border-radius: 6px;
  transition: color .15s;
  display: flex;
  align-items: center;
}
.card-fav:hover, .card-fav.active {
  color: #f43f5e;
}
.card-fav svg { width: 18px; height: 18px; }

.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--text3);
}
.empty h3 {
  font-family: var(--display);
  font-size: 20px;
  color: var(--text2);
  margin-bottom: 8px;
}

/* ========== MODAL ========== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  z-index: 200;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 40px 20px;
  overflow-y: auto;
  opacity: 0;
  visibility: hidden;
  transition: all .25s;
}
.modal-overlay.open {
  opacity: 1;
  visibility: visible;
}
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  width: 100%;
  max-width: 640px;
  padding: 36px;
  position: relative;
  transform: translateY(20px);
  transition: transform .25s;
}
.modal-overlay.open .modal {
  transform: translateY(0);
}
.modal-close {
  position: absolute;
  top: 20px;
  right: 20px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text2);
  transition: all .15s;
}
.modal-close:hover {
  background: var(--surface3);
  color: var(--text);
}
.modal-cat {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--accent);
  margin-bottom: 8px;
}
.modal-title {
  font-family: var(--display);
  font-weight: 800;
  font-size: 28px;
  line-height: 1.2;
  letter-spacing: -0.03em;
  margin-bottom: 20px;
  padding-right: 40px;
}
.modal-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 28px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--border);
}
.meta-item {
  font-size: 13px;
  color: var(--text3);
}
.meta-item strong {
  color: var(--text);
  font-weight: 600;
}
.modal-macros {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 32px;
}
.macro-box {
  background: var(--surface2);
  border-radius: 12px;
  padding: 14px 12px;
  text-align: center;
}
.macro-box strong {
  display: block;
  font-family: var(--display);
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.02em;
}
.macro-box span {
  font-size: 11px;
  color: var(--text3);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.section-title {
  font-family: var(--display);
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -0.01em;
  margin-bottom: 12px;
  color: var(--text);
}
.ingredients {
  list-style: none;
  margin-bottom: 28px;
}
.ingredients li {
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
  color: var(--text2);
  display: flex;
  gap: 10px;
}
.ingredients li::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  margin-top: 7px;
  flex-shrink: 0;
}
.steps {
  list-style: none;
  counter-reset: step;
  margin-bottom: 28px;
}
.steps li {
  counter-increment: step;
  padding: 12px 0 12px 40px;
  position: relative;
  font-size: 14px;
  color: var(--text2);
  line-height: 1.6;
  border-bottom: 1px solid var(--border);
}
.steps li::before {
  content: counter(step);
  position: absolute;
  left: 0;
  top: 12px;
  width: 26px;
  height: 26px;
  background: var(--accent-soft);
  color: var(--accent);
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 8px;
}
.btn {
  border: none;
  border-radius: 12px;
  padding: 12px 20px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.btn-primary {
  background: var(--accent);
  color: #000;
}
.btn-primary:hover {
  background: var(--accent2);
}
.btn-ghost {
  background: var(--surface2);
  color: var(--text2);
  border: 1px solid var(--border);
}
.btn-ghost:hover {
  background: var(--surface3);
  color: var(--text);
}
.btn-ghost.active {
  color: #f43f5e;
  border-color: rgba(244,63,94,0.3);
}

/* ========== FOOTER ========== */
.footer {
  border-top: 1px solid var(--border);
  padding: 32px 28px;
  text-align: center;
  color: var(--text3);
  font-size: 13px;
}
.footer strong {
  color: var(--text2);
  font-weight: 600;
}

/* ========== RESPONSIVE ========== */
@media (max-width: 640px) {
  .nav { padding: 0 16px; gap: 12px; }
  .nav-logo { font-size: 16px; }
  .nav-search { max-width: none; }
  .nav-actions .nav-btn span { display: none; }
  .hero { padding: 48px 16px 36px; }
  .hero-stats { gap: 24px; }
  .filters { padding: 0 16px 24px; }
  .main { padding: 0 16px 60px; }
  .grid { grid-template-columns: 1fr; gap: 14px; }
  .modal { padding: 28px 20px; border-radius: 16px; }
  .modal-title { font-size: 22px; }
  .modal-macros { grid-template-columns: repeat(2, 1fr); }
}

@media print {
  .nav, .filters, .hero, .modal-close, .modal-actions, .card-fav { display: none !important; }
  .modal-overlay { position: static; background: none; padding: 0; }
  .modal { box-shadow: none; border: none; max-width: 100%; }
  body { background: white; color: black; }
}
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <div class="nav-logo">Coach <span>Anis</span></div>
  <div class="nav-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>

      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
      <span>Favorites</span>
      <span class="nav-fav-count" id="favCount">0</span>

</nav>

<!-- HERO -->
<section class="hero">
  <div class="hero-badge">High Protein • Macro Friendly</div>
  <h1>Practical recipes<br>for <em>serious results</em></h1>
  <p>Clean, high-protein meals with full macros. Built for training, fat loss and performance.</p>
  <div class="hero-stats">
    <div class="hero-stat"><strong id="recipeCount">50</strong><span>Recipes</span></div>
    <div class="hero-stat"><strong>High</strong><span>Protein Focus</span></div>

<!-- FILTERS -->
<div class="filters" id="filters">
  <button class="filter-btn active" data-cat="all">All</button>
  <button class="filter-btn" data-cat="breakfast">Breakfast</button>
  <button class="filter-btn" data-cat="lunch">Lunch</button>
  <button class="filter-btn" data-cat="dinner">Dinner</button>
  <button class="filter-btn" data-cat="salad">Salad</button>

  <button class="filter-btn" data-cat="snack">Snack</button>
</div>

<!-- GRID -->
<main class="main">
  <div class="grid" id="grid"></div>
</main>

<!-- FOOTER -->
<footer class="footer">
  <strong>Coach Anis</strong> — High Protein Recipe Library
</footer>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal" id="modalContent"></div>
</div>

<script>
const recipes = [
  {id:1,cat:"breakfast",name:"Spanish Zucchini Tortilla",time:"35 min",servings:2,kcal:377,protein:21,carbs:22,fat:22,ingredients:["1 tbsp olive oil","1 small potato, peeled & chopped","1 small onion, chopped","½ small zucchini, thinly sliced","6 eggs"],steps:["Heat oil in a non-stick pan and sear the potato and onion over medium-high heat for about 4 minutes. Add the zucchini and sauté for another 4 minutes.","In a bowl, whisk eggs and season with salt and pepper. Transfer the vegetables into the bowl and mix well.","Using the same pan, add the egg mixture on low heat. After about 3 minutes, run a spatula around the edges.","After 8-10 minutes, flip the tortilla using a plate. Slide the uncooked part back into the pan.","After another 5-6 minutes the tortilla should be cooked. Remove from heat and serve."]},
  {id:2,cat:"breakfast",name:"Omelet Wraps",time:"25 min",servings:4,kcal:237,protein:20,carbs:3,fat:15,ingredients:["7 oz (200g) cottage cheese","4 handfuls watercress","1 lemon, peel only","6 eggs","¼ cup (50ml) soy milk","1 tsp mixed herbs","4 tsp coconut oil","3.5 oz (100g) smoked salmon, chopped"],steps:["Place the cottage cheese, watercress and lemon peel in a bowl and puree until smooth.","Beat the eggs with the milk and herbs in a separate bowl.","Heat 1 tsp oil in a medium pan and fry ¼ of the egg mixture for 2 minutes until solid, then flip for 30 seconds.","Repeat for remaining omelets.","Spread the cottage cheese paste over each omelet, top with smoked salmon, roll up and cut in half."]},
  {id:3,cat:"breakfast",name:"Egg & Turkey Stuffed Peppers",time:"25 min",servings:4,kcal:329,protein:43,carbs:11,fat:12,ingredients:["4 eggs","4 egg whites","2 tbsp almond milk","1 tsp coconut oil","1 small onion, chopped","1 lb (450g) lean ground turkey","2 tsp oregano","1 tsp cumin","2 cups (60g) spinach, chopped","4 red medium bell peppers","½ cup (50g) cheese","parsley to serve"],steps:["Heat oven to 400°F (200°C). Beat eggs, egg whites and milk.","Heat coconut oil, cook onion 3 minutes. Add turkey, oregano, cumin, salt and pepper. Cook 5 minutes. Add spinach until wilted.","Add eggs and scramble for about 3 minutes.","Cut peppers horizontally, remove seeds, stuff with the mixture.","Place in baking dish, sprinkle with cheese and bake 15 minutes. Garnish with parsley."]},
  {id:4,cat:"breakfast",name:"Smoked Salmon, Feta & Asparagus Omelet",time:"25 min",servings:2,kcal:302,protein:20,carbs:6,fat:21,ingredients:["4 oz (125g) asparagus","1 tsp coconut oil","3 large eggs","5 tbsp (70ml) milk","2 oz (60g) smoked salmon","¼ cup (30g) feta cheese, cubed","4-5 cherry tomatoes, halved","dill to serve"],steps:["Break off hard ends of asparagus, cut softer stalks into ½ cm pieces. Boil 2 minutes, strain.","Whisk eggs with milk, salt and pepper. Add asparagus, salmon and cheese.","Heat oil in a 24cm pan, pour in mixture. Top with cherry tomatoes.","Cover and cook 5 minutes, then transfer to 350°F oven for 6-10 minutes until set.","Sprinkle with dill and black pepper."]},
  {id:5,cat:"breakfast",name:"High Protein Blueberry Pancakes",time:"15 min",servings:1,kcal:257,protein:36,carbs:18,fat:5,ingredients:["¼ cup liquid egg whites (around 4 eggs)","1 scoop (25g) vanilla whey","½ banana, mashed","almond milk if needed","¼ cup (25g) blueberries","½ tsp coconut oil"],steps:["Whisk egg whites and protein powder.","Stir in mashed banana and blueberries. Thin with almond milk if needed.","Heat coconut oil on low-medium. Pour mixture and cook until bubbles form (~5 min).","Flip carefully and cook another 2-3 minutes.","Serve with your favorite toppings."]},
  {id:6,cat:"breakfast",name:"Eggs Fried On Tomatoes With Tuna",time:"10 min",servings:1,kcal:307,protein:32,carbs:8,fat:15,ingredients:["1 large tomato","1 tsp coconut oil","2 eggs","3 oz (80g) tuna in brine","pinch of oregano","pinch of chili flakes","parsley to serve"],steps:["Peel and chop the tomato into cubes.","Heat oil, add tomato and fry on high heat 3 minutes.","Create 2 gaps and break eggs into them. Season with salt and pepper.","Arrange tuna on top, sprinkle with oregano and chili.","Fry another 3 minutes until whites are set. Serve with parsley."]},
  {id:7,cat:"smoothie",name:"Summer Smoothie Protein Bowl",time:"10 min",servings:2,kcal:252,protein:18,carbs:36,fat:5,ingredients:["2 medium peaches, frozen","1 medium banana, frozen","¾ cup (190g) natural yogurt","½ cup (125ml) coconut water","1 scoop (25g) vanilla protein powder"],steps:["Place all ingredients in a high-speed blender and blitz until smooth.","Divide between 2 bowls, add toppings (berries, goji, walnuts, chia) and serve."]},
  {id:8,cat:"breakfast",name:"Spinach Shakshuka",time:"25 min",servings:2,kcal:321,protein:24,carbs:19,fat:22,ingredients:["1 tbsp coconut oil","1 large onion, chopped","2 garlic cloves, crushed","4 cups (300g) mushrooms, sliced","2 cups (450g) leaf spinach","4 eggs","handful parsley"],steps:["Heat oil, cook onion and garlic 2-3 minutes. Add mushrooms 3-4 minutes. Season.","Add spinach in batches, cover until wilted. Stir and taste for seasoning.","Make 4 wells and break an egg into each. Cover and cook 5-6 minutes until whites set.","Dress with parsley and serve."]},
  {id:9,cat:"lunch",name:"Salmon Tartar With Avocado & Mango",time:"10 min",servings:1,kcal:282,protein:26,carbs:9,fat:17,ingredients:["1 small salmon fillet (100g), cubed","¼ avocado, cubed","¼ cup (30g) mango, cubed","1 tbsp lime juice","½ tsp honey","chili to taste","handful coriander"],steps:["Cut salmon, avocado and mango into small cubes.","Mix with lime juice, chili and coriander. Season with salt and pepper.","Chill at least 10 minutes. Serve with toast if desired."]},

let activeCat = 'all';
let showFavsOnly = false;
let favorites = JSON.parse(localStorage.getItem('ca_favs') || '[]');

function updateFavCount() {
  const el = document.getElementById('favCount');
  el.textContent = favorites.length;
  el.classList.toggle('show', favorites.length > 0);
}

function toggleFav(id, e) {
  if (e) e.stopPropagation();
  const idx = favorites.indexOf(id);
  if (idx > -1) favorites.splice(idx, 1);
  else favorites.push(id);
  localStorage.setItem('ca_favs', JSON.stringify(favorites));
  updateFavCount();
  render();
  if (document.getElementById('modal').classList.contains('open')) {
    openModal(id);
  }
}

function toggleFavView() {
  showFavsOnly = !showFavsOnly;
  document.getElementById('favToggle').classList.toggle('active', showFavsOnly);
  render();
}

function render() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  let list = recipes.filter(r => {
    if (showFavsOnly && !favorites.includes(r.id)) return false;
    if (activeCat !== 'all' && r.cat !== activeCat) return false;
    if (q && !r.name.toLowerCase().includes(q) && !r.ingredients.some(i => i.toLowerCase().includes(q))) return false;
    return true;
  });

  const grid = document.getElementById('grid');
  if (!list.length) {
    grid.innerHTML = `<div class="empty"><h3>No recipes found</h3><p>Try a different search or filter</p></div>`;
    return;
  }

  grid.innerHTML = list.map(r => `
    <article class="card" onclick="openModal(${r.id})">
      <div class="card-cat">${r.cat}</div>
      <h2 class="card-title">${r.name}</h2>
      <div class="card-macros">
        <span class="macro"><strong>${r.kcal}</strong> kcal</span>
        <span class="macro"><strong>${r.protein}g</strong> protein</span>
        <span class="macro"><strong>${r.carbs}g</strong> carbs</span>
        <span class="macro"><strong>${r.fat}g</strong> fat</span>
      </div>
      <div class="card-footer">
        <span class="card-time">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          ${r.time}
        </span>
        <button class="card-fav ${favorites.includes(r.id) ? 'active' : ''}" onclick="toggleFav(${r.id}, event)" aria-label="Favorite">
          <svg viewBox="0 0 24 24" fill="${favorites.includes(r.id) ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        </button>
      </div>
    </article>
  `).join('');
}

function openModal(id) {
  const r = recipes.find(x => x.id === id);
  if (!r) return;
  const isFav = favorites.includes(r.id);
  document.getElementById('modalContent').innerHTML = `
    <button class="modal-close" onclick="closeModal()" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div class="modal-cat">${r.cat}</div>
    <h2 class="modal-title">${r.name}</h2>
    <div class="modal-meta">
      <span class="meta-item"><strong>${r.time}</strong> total</span>
      <span class="meta-item"><strong>${r.servings}</strong> servings</span>
    </div>
    <div class="modal-macros">
      <div class="macro-box"><strong>${r.kcal}</strong><span>kcal</span></div>
      <div class="macro-box"><strong>${r.protein}g</strong><span>protein</span></div>
      <div class="macro-box"><strong>${r.carbs}g</strong><span>carbs</span></div>
      <div class="macro-box"><strong>${r.fat}g</strong><span>fat</span></div>
    </div>
    <h3 class="section-title">Ingredients</h3>
    <ul class="ingredients">${r.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>
    <h3 class="section-title">Instructions</h3>
    <ol class="steps">${r.steps.map(s => `<li>${s}</li>`).join('')}</ol>
    <div class="modal-actions">
      <button class="btn btn-ghost ${isFav ? 'active' : ''}" onclick="toggleFav(${r.id})">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        ${isFav ? 'Saved' : 'Save'}
      </button>
      <button class="btn btn-primary" onclick="window.print()">Print Recipe</button>
    </div>
  `;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

document.getElementById('search').addEventListener('input', render);

document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeCat = btn.dataset.cat;
  render();
});

document.getElementById('recipeCount').textContent = recipes.length;
updateFavCount();
render();
</script>
</body>
</html>
